name: PowerShell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = Join-Path $env:GITHUB_WORKSPACE 'PSScriptAnalyzerSettings.psd1'
          $target = Join-Path $env:GITHUB_WORKSPACE 'src'
          $results = Invoke-ScriptAnalyzer -Path $target -Recurse -Settings $settings

          if ($results) {
            $results | Sort-Object Severity, RuleName, ScriptName, Line | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found issues."
          }

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path "$env:GITHUB_WORKSPACE\tests" -CI
